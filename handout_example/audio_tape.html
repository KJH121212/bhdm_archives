<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ZyMedBio - 도청 테이프 재생기</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #0d110f;
    color: #d1dcd0;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 10px;
    margin: 0;
    user-select: none;
  }

  .instructions {
    margin-bottom: 15px;
    font-size: 13px;
    color: #4ade80;
    letter-spacing: 1px;
  }

  /* 카세트 플레이어 본체 */
  .deck-container {
    width: 620px;
    background: #242926;
    border: 4px solid #141816;
    border-radius: 8px;
    padding: 25px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.6);
  }

  /* 상단 테이프 윈도우 */
  .tape-housing {
    background: #111412;
    border: 3px solid #333d37;
    border-radius: 6px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 10px 40px;
    position: relative;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
  }

  .tape-label {
    position: absolute;
    top: 8px;
    font-size: 11px;
    color: #eab308;
    background: #422006;
    padding: 2px 8px;
    border-radius: 2px;
    border: 1px solid #ca8a04;
  }

  /* 릴 회전 휠 */
  .reel {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #e5e7eb;
    border: 6px dashed #4b5563;
    box-shadow: 0 0 5px rgba(0,0,0,0.5);
  }

  .reel.spinning {
    animation: spin 2s linear infinite;
  }

  @keyframes spin {
    100% { transform: rotate(360deg); }
  }

  /* 중앙 제어판 */
  .control-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px 0;
    padding: 10px 15px;
    background: #191f1c;
    border-radius: 4px;
    border: 1px solid #2f3b34;
  }

  .btn {
    background: #374151;
    color: #fff;
    border: 1px solid #4b5563;
    padding: 8px 18px;
    font-size: 13px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    border-radius: 3px;
    box-shadow: 0 3px 0 #1f2937;
    transition: all 0.2s ease;
  }

  .btn:active {
    transform: translateY(2px);
    box-shadow: none;
  }

  .btn-play { background: #15803d; border-color: #22c55e; }
  .btn-stop { background: #b91c1c; border-color: #ef4444; }

  .time-display {
    color: #22c55e;
    font-size: 18px;
    text-shadow: 0 0 5px rgba(34, 197, 94, 0.6);
  }

  /* 볼륨 VU 미터기 */
  .vu-meter {
    display: flex;
    gap: 3px;
    height: 16px;
    align-items: flex-end;
  }

  .vu-bar {
    width: 6px;
    height: 3px;
    background: #22c55e;
    transition: height 0.1s ease;
  }

  /* 하단 녹취록 헤더 및 화면 */
  .screen-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding: 0 2px;
  }

  .screen-title {
    font-size: 12px;
    color: #88ffaa;
    font-weight: bold;
  }

  .btn-copy {
    background: #1e293b;
    border: 1px solid #4ade80;
    color: #4ade80;
    padding: 4px 10px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 3px;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: background 0.2s, color 0.2s;
  }

  .btn-copy:hover {
    background: #4ade80;
    color: #0d110f;
  }

  .transcript-screen {
    background: #050806;
    border: 2px solid #22c55e;
    border-radius: 4px;
    padding: 15px;
    min-height: 140px;
    max-height: 180px;
    overflow-y: auto;
    color: #4ade80;
    font-size: 13.5px;
    line-height: 1.6;
    box-shadow: inset 0 0 15px rgba(34, 197, 94, 0.15);
    user-select: text; /* 텍스트 직접 드래그 복사도 허용 */
  }

  .glitch-text {
    color: #ef4444 !important;
    text-shadow: 0 0 8px #ef4444;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="instructions">
  [!] 도청 기록 테이프: [REC_1984_ZYMED_SECURITY.DAT]
</div>

<div class="deck-container">
  <!-- 카세트 테이프 하우징 -->
  <div class="tape-housing">
    <div class="tape-label">ZYMEDBIO - SEC_LINE_4 (밀실 감시 녹음)</div>
    <div class="reel" id="leftReel"></div>
    <div class="reel" id="rightReel"></div>
  </div>

  <!-- 컨트롤 바 -->
  <div class="control-bar">
    <div>
      <button class="btn btn-play" id="playBtn">▶ PLAY</button>
      <button class="btn btn-stop" id="stopBtn">■ STOP</button>
    </div>
    <div class="vu-meter">
      <div class="vu-bar" id="vb1"></div>
      <div class="vu-bar" id="vb2"></div>
      <div class="vu-bar" id="vb3"></div>
      <div class="vu-bar" id="vb4"></div>
      <div class="vu-bar" id="vb5" style="background:#eab308;"></div>
      <div class="vu-bar" id="vb6" style="background:#ef4444;"></div>
    </div>
    <div class="time-display" id="timeDisplay">00:00</div>
  </div>

  <!-- 녹취록 상단 툴바 (복사 버튼) -->
  <div class="screen-header">
    <span class="screen-title">[ 실시간 녹취록 디스플레이 ]</span>
    <button class="btn-copy" id="copyBtn">📋 텍스트 복사</button>
  </div>

  <!-- 실시간 녹취록 출력 화면 -->
  <div class="transcript-screen" id="transcript">
    [대기 상태] PLAY 버튼을 눌러 복원된 음성 신호를 재생하십시오...
  </div>
</div>

<script>
  const playBtn = document.getElementById('playBtn');
  const stopBtn = document.getElementById('stopBtn');
  const copyBtn = document.getElementById('copyBtn');
  const leftReel = document.getElementById('leftReel');
  const rightReel = document.getElementById('rightReel');
  const timeDisplay = document.getElementById('timeDisplay');
  const transcript = document.getElementById('transcript');
  const vuBars = [document.getElementById('vb1'), document.getElementById('vb2'), document.getElementById('vb3'), document.getElementById('vb4'), document.getElementById('vb5'), document.getElementById('vb6')];

  let isPlaying = false;
  let timer = null;
  let seconds = 0;
  let audioCtx = null;
  let noiseNode = null;

  const logs = [
    { time: 1, text: "[지직... 치이익- (수신 감도 양호)]" },
    { time: 3, speaker: "웨슬리 라이스 (경비실장)", text: "서장님, 루시오 놈 입은 확실히 막으신 겁니까?" },
    { time: 7, speaker: "테드 도슨 서장", text: "걱정 마라. 사건은 단순 야생동물 습격으로 종결 처리했어. 필립스 형사도 내근직으로 돌려놨다." },
    { time: 13, speaker: "테드 도슨 서장", text: "(거친 숨소리) ...그런데 아낙 형제에게 전해. 약이... 약효가 이상해. 자꾸 입 안에서 털이 씹혀..." },
    { time: 19, speaker: "웨슬리 라이스", text: "진정하십시오. 그것은 신의 축복이 육체에 정착하는 과정입니다." },
    { time: 24, text: "[정체불명의 기괴한 짐승 울음소리와 유리가 깨지는 소음]", isGlitch: true },
    { time: 27, speaker: "테드 도슨 서장", text: "크아아악! 젖... 검은 염소의 젖을 더 가져와!!", isGlitch: true },
    { time: 31, text: "[SYSTEM ERROR: 오디오 신호 강제 단절 / 세션 종료]", isGlitch: true }
  ];

  function startNoise() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const bufferSize = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.04;
    }
    noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = buffer;
    noiseNode.loop = true;
    noiseNode.connect(audioCtx.destination);
    noiseNode.start();
  }

  function stopNoise() {
    if (noiseNode) {
      noiseNode.stop();
      noiseNode.disconnect();
      noiseNode = null;
    }
    if (audioCtx) {
      audioCtx.close();
      audioCtx = null;
    }
  }

  function updateVUMeter() {
    if (!isPlaying) {
      vuBars.forEach(b => b.style.height = '3px');
      return;
    }
    vuBars.forEach(b => {
      const h = Math.floor(Math.random() * 14) + 3;
      b.style.height = `${h}px`;
    });
  }

  playBtn.addEventListener('click', () => {
    if (isPlaying) return;
    isPlaying = true;
    leftReel.classList.add('spinning');
    rightReel.classList.add('spinning');
    transcript.innerHTML = "";
    startNoise();

    timer = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      timeDisplay.innerText = `${m}:${s}`;
      updateVUMeter();

      const currentLog = logs.find(l => l.time === seconds);
      if (currentLog) {
        const line = document.createElement('div');
        line.style.marginBottom = "6px";
        if (currentLog.isGlitch) line.className = "glitch-text";
        
        if (currentLog.speaker) {
          line.innerHTML = `<strong>[${currentLog.speaker}]</strong> ${currentLog.text}`;
        } else {
          line.innerText = currentLog.text;
        }
        transcript.appendChild(line);
        transcript.scrollTop = transcript.scrollHeight;
      }

      if (seconds >= 33) {
        stopPlayback();
      }
    }, 1000);
  });

  function stopPlayback() {
    isPlaying = false;
    clearInterval(timer);
    leftReel.classList.remove('spinning');
    rightReel.classList.remove('spinning');
    seconds = 0;
    timeDisplay.innerText = "00:00";
    updateVUMeter();
    stopNoise();
  }

  stopBtn.addEventListener('click', stopPlayback);

  // 복사하기 기능
  copyBtn.addEventListener('click', () => {
    const textToCopy = transcript.innerText.trim();
    if (!textToCopy || textToCopy.startsWith("[대기 상태]")) {
      alert("먼저 녹취록을 재생해 주십시오.");
      return;
    }

    navigator.clipboard.writeText(textToCopy).then(() => {
      const originalText = copyBtn.innerHTML;
      copyBtn.innerHTML = "✓ 복사 완료!";
      copyBtn.style.background = "#22c55e";
      copyBtn.style.color = "#000";

      setTimeout(() => {
        copyBtn.innerHTML = originalText;
        copyBtn.style.background = "#1e293b";
        copyBtn.style.color = "#4ade80";
      }, 1500);
    }).catch(err => {
      console.error("복사 실패:", err);
    });
  });
</script>

</body>
</html>
